[package]
name = "app"
version = "0.1.0"
description = "A Glacier UI desktop app"
authors = ["you"]
edition = "2021"

# The library the app binary links against; also what mobile targets build.
[lib]
name = "app_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = [] }
tauri-plugin-opener = "2"
# Positions the native macOS traffic-light buttons so they sit centered in the
# taller custom title bar (and re-applies the inset on resize). No-op elsewhere.
tauri-plugin-decorum = "1"
tauri-plugin-updater = "2"
tauri-plugin-process = "2"
serde = { version = "1", features = ["derive"] }
serde_json = "1"

[features]
# Kept in sync with tauri.conf.json > app > security > csp.
custom-protocol = ["tauri/custom-protocol"]

# tao 0.35.3 returns a DANGLING pointer from the iOS app delegate's
# application:configurationForConnectingSceneSession: - it hands UIKit a
# UISceneConfiguration that its own Retained wrapper frees on return, so UIKit
# retained freed memory and the app segfaulted on launch before drawing a
# frame. iOS 26+ made this reachable by requiring scene-lifecycle adoption.
# vendor/tao is 0.35.3 verbatim plus upstream's own one-line fix (autorelease
# instead of borrow), which shipped in tao 0.36.0 - a version we cannot take,
# because tauri-runtime-wry 2.11.4 pins tao ^0.35. Drop this patch when the
# tauri stack moves to tao 0.36. The change is inside platform_impl/ios, so
# desktop builds are byte-for-byte unaffected.
[patch.crates-io]
tao = { path = "vendor/tao" }
