<!doctype html>
<html lang="en" data-theme="dark">
  <head>
    <meta charset="UTF-8" />
    <meta
      name="viewport"
      content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover"
    />
    <title>pdDock geometry probe</title>

    <!-- REAL stylesheets, served by the running vite dev server. Nothing is
         copied: `?direct` makes vite hand back the raw CSS file. -->
    <link rel="stylesheet" href="/node_modules/@glacier/tokens/css/tokens.css?direct" />
    <link rel="stylesheet" href="/src/app/components/packDock.css?direct" />

    <style>
      /* The app's own reset (src/app/app.css). border-box is load-bearing: the
         panel's `width` caps are border-box values, and layoutSize() takes a
         different branch under content-box. NOTE: no font-size anywhere - the
         app never sets one either, so 1rem stays 16px and the panel's rem-based
         width/height caps measure exactly as they do in the app. */
      *,
      *::before,
      *::after {
        box-sizing: border-box;
      }
      html,
      body {
        margin: 0;
        padding: 0;
        background: #0f0f10;
        color: #ddd;
        min-height: 100%;
      }
      /* The probe's own readout must never affect the dock's geometry. */
      #out {
        position: fixed;
        inset: 0;
        overflow: auto;
        padding: 4px;
        pointer-events: none;
        opacity: 0.25;
        z-index: 1;
        font: 12px/1.4 ui-monospace, monospace;
      }
      /* Stand-ins for the kit controls inside the panel. Only their BOX matters
         to the clamp, so they are plain blocks at the real controls' heights. */
      .stub {
        flex: none;
        border-radius: 6px;
        background: rgba(255, 255, 255, 0.08);
      }
      .stubHead {
        height: 28px;
      }
      .stubSeg {
        height: 28px;
      }
      .stubBtn {
        height: 44px;
      }
      .stubFill {
        height: var(--probe-fill, 180px);
      }
    </style>
  </head>
  <body>
    <div id="mount"></div>
    <pre id="out">probe idle</pre>

    <!-- vite's react plugin injects this into index.html; a static public/ page
         has to install it by hand or importing any .tsx throws. -->
    <script type="module">
      import RefreshRuntime from '/@react-refresh';
      RefreshRuntime.injectIntoGlobalHook(window);
      window.$RefreshReg$ = () => {};
      window.$RefreshSig$ = () => (type) => type;
      window.__vite_plugin_react_preamble_installed__ = true;
    </script>

    <script type="module">
      /* ------------------------------------------------------------------
         The clamp math, COPIED from src/app/components/PackDock.tsx (types
         stripped). The copy is cross-checked at runtime against the REAL
         exported `fitIntoViewport` imported from the source file below, so a
         drift between this copy and the shipped function is a hard failure of
         the probe rather than a silent false PASS.
         ------------------------------------------------------------------ */

      const PILL_EDGE = 8;
      const PANEL_EDGE = 12;
      const SETTLE_EPSILON = 0.05;

      function fitAxis(start, size, view, gutter) {
        if (!Number.isFinite(start) || !Number.isFinite(size) || !Number.isFinite(view)) return 0;
        const pad = Number.isFinite(gutter) ? Math.min(Math.max(gutter, 0), Math.max(view, 0) / 2) : 0;
        const slack = view - size;
        if (slack < 0) return pad - start;
        const lo = Math.min(pad, slack / 2);
        return Math.min(Math.max(start, lo), slack - lo) - start;
      }

      function fitIntoViewportCopy(box, view, gutter) {
        return {
          dx: fitAxis(box.left, box.width, view.width, gutter),
          dy: fitAxis(box.top, box.height, view.height, gutter),
        };
      }

      function restPad(want, rest, size, view) {
        const nearest = Math.min(rest, view - rest - size);
        if (!Number.isFinite(nearest)) return want;
        return Math.max(0, Math.min(want, nearest));
      }

      function fitDock(box, offset, view, gutter) {
        return {
          dx: fitAxis(box.left, box.width, view.width, restPad(gutter, box.left - offset.x, box.width, view.width)),
          dy: fitAxis(box.top, box.height, view.height, restPad(gutter, box.top - offset.y, box.height, view.height)),
        };
      }

      function viewportSize() {
        return { width: window.innerWidth, height: window.innerHeight };
      }

      function layoutSize(el) {
        const style = window.getComputedStyle(el);
        if (style.boxSizing === 'border-box') {
          const width = Number.parseFloat(style.width);
          const height = Number.parseFloat(style.height);
          if (width > 0 && height > 0) return { width, height };
        }
        return { width: el.offsetWidth, height: el.offsetHeight };
      }

      function offsetWithin(dock, el) {
        let left = 0;
        let top = 0;
        let node = el;
        while (node && node !== dock) {
          left += node.offsetLeft;
          top += node.offsetTop;
          node = node.offsetParent;
        }
        return node === dock ? { left, top } : null;
      }

      function boxAt(dock, el, shift) {
        const dx = shift?.x ?? 0;
        const dy = shift?.y ?? 0;
        const dockRect = dock.getBoundingClientRect();
        const offset = offsetWithin(dock, el);
        if (offset) {
          const size = layoutSize(el);
          return {
            left: dockRect.left + offset.left + dx,
            top: dockRect.top + offset.top + dy,
            width: size.width,
            height: size.height,
          };
        }
        const rect = el.getBoundingClientRect();
        return { left: rect.left + dx, top: rect.top + dy, width: rect.width, height: rect.height };
      }

      /* ------------------------------------------------------------------
         The component's own state machine, mirrored: `pos`, `anchored`, the
         render that writes the dock's translate, `nudge`'s stale-measurement
         guard, and `settle` itself.
         ------------------------------------------------------------------ */

      /** The QUEUED state - what `setPos`'s updater sees as `prev`. */
      let pos = { x: 0, y: 0 };
      /** `posRef.current`: written during RENDER only, so a second settle in
       *  the same commit measures - and reports - the stale offset, exactly as
       *  the component does. Modelling these as one value would let a second
       *  settle stack its correction, which React's guard forbids. */
      let posRef = { x: 0, y: 0 };
      let anchored = false;
      let dockEl = null;
      let panelEl = null;
      let pillEl = null;
      /** Mirrors React re-running the `[anchored]` layout effect. */
      let anchoredDirty = false;
      /** How many settle() calls actually changed `pos` in this scenario. */
      let effectivePasses = 0;

      function render() {
        // `posRef.current = pos` happens in the render body, before the DOM
        // carrying that offset exists.
        posRef = { x: pos.x, y: pos.y };
        // The exact expression from PackDock.tsx's style prop.
        dockEl.style.translate = anchored ? 'none' : `${pos.x}px calc(-50% + ${pos.y}px)`;
        // Force layout so the next measurement sees the new transform.
        void dockEl.offsetWidth;
      }

      function setAnchored(next) {
        if (next !== anchored) {
          anchored = next;
          anchoredDirty = true;
        }
      }

      function nudge(from, delta) {
        if (Math.abs(delta.dx) < SETTLE_EPSILON && Math.abs(delta.dy) < SETTLE_EPSILON) return;
        // `setPos(prev => prev === from ? from + delta : prev)`: a second settle
        // against the same commit carries a stale `from` and is dropped.
        if (pos.x !== from.x || pos.y !== from.y) return;
        pos = { x: from.x + delta.dx, y: from.y + delta.dy };
        effectivePasses += 1;
      }

      function settle() {
        const dock = dockEl;
        if (!dock) return;
        const view = viewportSize();
        const from = posRef;
        const panel = panelEl;
        if (panel) {
          const pinned = window.getComputedStyle(panel).position === 'fixed';
          setAnchored(pinned);
          if (pinned) return;
          if (panel.offsetWidth > 0 && panel.offsetHeight > 0) {
            nudge(from, fitDock(boxAt(dock, panel), from, view, PANEL_EDGE));
            return;
          }
        } else {
          setAnchored(false);
        }
        const pill = pillEl;
        if (pill && pill.offsetWidth > 0 && pill.offsetHeight > 0) {
          nudge(from, fitDock(boxAt(dock, pill), from, view, PILL_EDGE));
          return;
        }
        nudge(from, fitDock(dock.getBoundingClientRect(), from, view, PILL_EDGE));
      }

      /* ------------------------------------------------------------------
         DOM: the real element tree, class for class.
         ------------------------------------------------------------------ */

      const mount = document.getElementById('mount');

      function buildDock(mode, fill) {
        mount.innerHTML = '';
        const dock = document.createElement('div');
        dock.className = 'pdDock';
        if (mode === 'panel') {
          // .pdPanel is itself the motion.div, a DIRECT child of .pdDock.
          const panel = document.createElement('div');
          panel.className = 'pdPanel';
          panel.setAttribute('role', 'dialog');
          panel.tabIndex = -1;
          panel.innerHTML =
            '<div class="pdHead stub stubHead"></div>' +
            '<div class="stub stubSeg"></div>' +
            '<div class="pdBody"><div class="stub stubFill"></div></div>' +
            '<div class="stub stubBtn"></div>';
          panel.style.setProperty('--probe-fill', `${fill}px`);
          dock.appendChild(panel);
          panelEl = panel;
          pillEl = null;
        } else {
          // The pill sits one motion wrapper deep inside .pdDock.
          const wrap = document.createElement('div');
          const pill = document.createElement('div');
          pill.className = 'pdPill';
          pill.innerHTML =
            '<span class="pdPillMain stub" style="width:118px;height:28px"></span>' +
            '<span class="stub" style="width:28px;height:28px"></span>';
          wrap.appendChild(pill);
          dock.appendChild(wrap);
          pillEl = pill;
          panelEl = null;
        }
        mount.appendChild(dock);
        dockEl = dock;
        return dock;
      }

      function rectOf(el) {
        const r = el.getBoundingClientRect();
        return {
          L: +r.left.toFixed(2),
          T: +r.top.toFixed(2),
          R: +r.right.toFixed(2),
          B: +r.bottom.toFixed(2),
          W: +r.width.toFixed(2),
          H: +r.height.toFixed(2),
        };
      }

      /**
       * One scenario: mount the dock with a REMEMBERED position and run exactly
       * the settle sequence the component runs on a fresh load.
       *
       * PackDock's mount does, in one commit and against ONE un-updated DOM:
       *   attachPanel/attachPill ref callback -> settle()
       *   useLayoutEffect(mount)             -> settle()   (guarded: no-op)
       * then React re-renders, and only a CHANGED `anchored` re-runs a settle.
       * That is modelled literally, so "needs a second pass" shows up as a
       * failure instead of being hidden by a convergence loop.
       */
      function scenario(mode, stored, fill) {
        pos = { x: stored.x, y: stored.y };
        anchored = false;
        anchoredDirty = false;
        effectivePasses = 0;
        buildDock(mode, fill);
        render();

        // --- commit #1: both settles see the SAME, pre-update DOM ---
        settle();
        settle();
        render();

        // --- the [anchored] layout effect, only when it flipped ---
        let anchoredSettles = 0;
        while (anchoredDirty && anchoredSettles < 4) {
          anchoredDirty = false;
          anchoredSettles += 1;
          settle();
          render();
        }

        const el = mode === 'panel' ? panelEl : pillEl;
        const settled = rectOf(el);
        const posAfter = { x: +pos.x.toFixed(2), y: +pos.y.toFixed(2) };

        // Would ANOTHER settle move it? If yes, the shipped component (which
        // does not run one) leaves the box where `settled` says it is.
        const before = { x: pos.x, y: pos.y };
        settle();
        const residual = { dx: +(pos.x - before.x).toFixed(3), dy: +(pos.y - before.y).toFixed(3) };
        pos = before;
        render();

        return { mode, stored, fill, settled, posAfter, anchored, residual, effectivePasses };
      }

      /**
       * The resize path: settle at viewport A, then the window becomes B and
       * the `resize` listener fires exactly ONE settle. Driven by the harness,
       * which resizes the real window between the two calls.
       */
      let carried = null;
      function beginResize(mode, stored, fill) {
        const first = scenario(mode, stored, fill);
        carried = { mode, fill, pos: { x: pos.x, y: pos.y }, anchored };
        return first;
      }
      function finishResize() {
        if (!carried) return null;
        pos = { x: carried.pos.x, y: carried.pos.y };
        anchored = carried.anchored;
        anchoredDirty = false;
        effectivePasses = 0;
        render();
        settle();
        render();
        let guard = 0;
        while (anchoredDirty && guard < 4) {
          anchoredDirty = false;
          guard += 1;
          settle();
          render();
        }
        const el = carried.mode === 'panel' ? panelEl : pillEl;
        const settled = rectOf(el);
        const before = { x: pos.x, y: pos.y };
        settle();
        const residual = { dx: +(pos.x - before.x).toFixed(3), dy: +(pos.y - before.y).toFixed(3) };
        pos = before;
        render();
        return {
          mode: carried.mode,
          settled,
          posAfter: { x: +pos.x.toFixed(2), y: +pos.y.toFixed(2) },
          anchored,
          residual,
          effectivePasses,
        };
      }

      /* ------------------------------------------------------------------
         Cross-check: the copied `fitAxis` against the SHIPPED
         `fitIntoViewport`, so the probe cannot pass on stale math.
         ------------------------------------------------------------------ */

      let mathCheck = { ran: false, mismatches: -1, cases: 0, error: null };
      try {
        const mod = await import('/src/app/components/PackDock.tsx');
        const real = mod.fitIntoViewport;
        let bad = 0;
        let n = 0;
        let seed = 1234567;
        const rnd = () => ((seed = (seed * 1103515245 + 12345) & 0x7fffffff) / 0x7fffffff);
        for (let i = 0; i < 20000; i += 1) {
          const view = { width: Math.round(rnd() * 2200), height: Math.round(rnd() * 1400) };
          const box = {
            left: Math.round((rnd() - 0.5) * 6000),
            top: Math.round((rnd() - 0.5) * 6000),
            width: Math.round(rnd() * 1600),
            height: Math.round(rnd() * 1600),
          };
          const gutter = [0, 8, 12, 40, 5000][Math.floor(rnd() * 5)];
          const a = real(box, view, gutter);
          const b = fitIntoViewportCopy(box, view, gutter);
          n += 1;
          if (Math.abs(a.dx - b.dx) > 1e-9 || Math.abs(a.dy - b.dy) > 1e-9) bad += 1;
        }
        mathCheck = { ran: true, mismatches: bad, cases: n, error: null };
      } catch (err) {
        mathCheck = { ran: false, mismatches: -1, cases: 0, error: String(err && err.message ? err.message : err) };
      }

      /* ------------------------------------------------------------------ */

      const tokens = () => {
        const cs = getComputedStyle(document.documentElement);
        return {
          space2: cs.getPropertyValue('--glacier-space-2').trim(),
          space3: cs.getPropertyValue('--glacier-space-3').trim(),
          density: cs.getPropertyValue('--glacier-density-scale').trim(),
        };
      };

      /**
       * Closing the phone panel: AnimatePresence swaps the panel for the pill.
       * `attachPanel(null)` queues anchored=false and `attachPill` settles in
       * the SAME commit - so that settle measures a dock still carrying
       * `translate: none` while `pos` is the remembered offset. If the only
       * clamp were that one, the pill would come back at the stale offset. The
       * `[anchored]` layout effect has to catch it on the next commit.
       */
      function closePhonePanel(stored, fill) {
        // 1. the panel, open and anchored.
        scenario('panel', stored, fill);
        const wasAnchored = anchored;
        // 2. the swap commit: panel unmounts (setAnchored(false) is QUEUED, so
        //    the DOM still has translate:none), pill mounts and settles.
        anchoredDirty = false;
        effectivePasses = 0;
        const keptDock = dockEl;
        panelEl = null;
        buildDock('pill', fill);
        // The old dock is gone; the new one is rendered with the offset the old
        // commit had. Reproduce that by rendering with the CURRENT anchored.
        void keptDock;
        dockEl.style.translate = wasAnchored ? 'none' : `${posRef.x}px calc(-50% + ${posRef.y}px)`;
        void dockEl.offsetWidth;
        setAnchored(false); // attachPanel(null)
        settle(); // attachPill
        render();
        let guard = 0;
        while (anchoredDirty && guard < 4) {
          anchoredDirty = false;
          guard += 1;
          settle();
          render();
        }
        const settled = rectOf(pillEl);
        const before = { x: pos.x, y: pos.y };
        settle();
        const residual = { dx: +(pos.x - before.x).toFixed(3), dy: +(pos.y - before.y).toFixed(3) };
        pos = before;
        render();
        return { wasAnchored, settled, posAfter: { x: +pos.x.toFixed(2), y: +pos.y.toFixed(2) }, residual };
      }

      /** A panel forced bigger than the viewport, to exercise the pin branch. */
      function oversizeScenario(stored, w, h) {
        pos = { x: stored.x, y: stored.y };
        anchored = false;
        anchoredDirty = false;
        effectivePasses = 0;
        buildDock('panel', 180);
        panelEl.style.width = `${w}px`;
        panelEl.style.maxWidth = 'none';
        panelEl.style.minWidth = '0';
        panelEl.style.height = `${h}px`;
        panelEl.style.maxHeight = 'none';
        panelEl.style.position = 'static';
        render();
        settle();
        settle();
        render();
        let guard = 0;
        while (anchoredDirty && guard < 4) {
          anchoredDirty = false;
          guard += 1;
          settle();
          render();
        }
        const settled = rectOf(panelEl);
        const before = { x: pos.x, y: pos.y };
        settle();
        const residual = { dx: +(pos.x - before.x).toFixed(3), dy: +(pos.y - before.y).toFixed(3) };
        pos = before;
        render();
        return { settled, posAfter: { x: +pos.x.toFixed(2), y: +pos.y.toFixed(2) }, residual, anchored };
      }

      /** `clampPos` from PackDock.tsx, verbatim. */
      function clampPos(next) {
        const dock = dockEl;
        const pill = pillEl;
        if (!dock || !pill || pill.offsetWidth === 0 || pill.offsetHeight === 0) return next;
        const shift = { x: next.x - posRef.x, y: next.y - posRef.y };
        const { dx, dy } = fitDock(boxAt(dock, pill, shift), next, viewportSize(), PILL_EDGE);
        return { x: next.x + dx, y: next.y + dy };
      }

      /**
       * A drag: the pill starts at `start`, the gesture offsets it by `by`, and
       * `onDragEnd` hands the CLAMPED sum to the dock in one commit.
       */
      function dragScenario(start, by) {
        scenario('pill', start, 180);
        const next = { x: pos.x + by.x, y: pos.y + by.y };
        pos = clampPos(next);
        render();
        const settled = rectOf(pillEl);
        const before = { x: pos.x, y: pos.y };
        settle();
        const residual = { dx: +(pos.x - before.x).toFixed(3), dy: +(pos.y - before.y).toFixed(3) };
        pos = before;
        render();
        return { settled, posAfter: { x: +pos.x.toFixed(2), y: +pos.y.toFixed(2) }, residual };
      }

      window.__probe = {
        scenario,
        dragScenario,
        closePhonePanel,
        oversizeScenario,
        beginResize,
        finishResize,
        mathCheck,
        tokens,
        viewport: () => ({ w: innerWidth, h: innerHeight }),
        dir: () => document.documentElement.getAttribute('dir') || 'ltr',
        setDir: (d) => {
          if (d === 'rtl') document.documentElement.setAttribute('dir', 'rtl');
          else document.documentElement.removeAttribute('dir');
        },
        /** Force a box bigger than the viewport, to exercise the pin branch. */
        oversize: (w, h) => {
          if (!panelEl) return null;
          panelEl.style.width = `${w}px`;
          panelEl.style.maxWidth = 'none';
          panelEl.style.minWidth = '0';
          panelEl.style.height = `${h}px`;
          panelEl.style.maxHeight = 'none';
          return true;
        },
      };
      window.__probeReady = true;
      document.getElementById('out').textContent =
        'probe ready\nmath cross-check: ' + JSON.stringify(mathCheck) + '\ntokens: ' + JSON.stringify(tokens());
    </script>
  </body>
</html>
